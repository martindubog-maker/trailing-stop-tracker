name: Buscar Stock

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Símbolo o nombre de empresa a buscar"
        required: true

jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buscar el stock
        env:
          SEARCH_QUERY: ${{ github.event.inputs.query }}
        run: python search_stock.py

      - name: Guardar resultado
        run: |
          git config user.name "trailing-stop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add search_results.json
          git diff --staged --quiet || git commit -m "Resultado de búsqueda: ${{ github.event.inputs.query }}"
          git push
