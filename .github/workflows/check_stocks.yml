name: Revisar Trailing Stops

on:
  schedule:
    # Corre cada 15 minutos. El horario es en UTC (no en hora de Chile).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
    # Esto te permite además correrlo manualmente desde la app de GitHub
    # cuando quieras probarlo al tiro, sin esperar los 15 minutos.

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar el vigilante
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_stocks.py

      - name: Guardar cambios en watchlist.json
        run: |
          git config user.name "trailing-stop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add watchlist.json
          git diff --staged --quiet || git commit -m "Actualizar watchlist"
          git push
