<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trailing Stop Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0f172a">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #273449;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --green: #16a34a;
    --red: #dc2626;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 90px;
  }
  header {
    padding: 20px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 { font-size: 20px; margin: 0; }
  .icon-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 10px;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  main { padding: 0 16px; max-width: 480px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .stock-row { display: flex; justify-content: space-between; align-items: center; }
  .stock-symbol { font-size: 18px; font-weight: 600; }
  .stock-meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  .badge.active { background: rgba(22,163,74,0.15); color: #4ade80; }
  .badge.triggered { background: rgba(220,38,38,0.15); color: #f87171; }
  .del-btn {
    background: none; border: none; color: var(--muted);
    font-size: 20px; padding: 4px 8px; cursor: pointer;
  }
  .empty {
    text-align: center; color: var(--muted); padding: 40px 20px;
    font-size: 14px;
  }
  .fab {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: white; border: none;
    padding: 14px 28px; border-radius: 30px; font-size: 15px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(22,163,74,0.4);
  }
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: flex-end; justify-content: center; z-index: 10;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 24px 20px 32px;
  }
  .modal h2 { margin: 0 0 16px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; background: var(--card-2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 16px;
  }
  .row-btns { display: flex; gap: 10px; margin-top: 22px; }
  button.primary {
    flex: 1; background: var(--green); color: white; border: none;
    padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 600;
  }
  button.secondary {
    flex: 1; background: var(--card-2); color: var(--text); border: 1px solid var(--border);
    padding: 13px; border-radius: 10px; font-size: 15px;
  }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .msg.error { color: #f87171; }
  .msg.ok { color: #4ade80; }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .setup-note { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
</style>
</head>
<body>

<header>
  <h1>📉 Trailing Stop</h1>
  <button class="icon-btn" onclick="openSettings()">⚙️</button>
</header>

<main>
  <div id="list"></div>
</main>

<button class="fab" onclick="openAdd()">+ Agregar stock</button>

<!-- Modal: agregar stock -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <h2>Agregar stock</h2>
    <label>Símbolo (ticker)</label>
    <input id="symbolInput" placeholder="Ej: AAPL" autocapitalize="characters">
    <label>Trailing stop (%)</label>
    <input id="pctInput" type="number" placeholder="Ej: 8" inputmode="decimal">
    <div class="msg" id="addMsg"></div>
    <div class="row-btns">
      <button class="secondary" onclick="closeAdd()">Cancelar</button>
      <button class="primary" id="addBtn" onclick="addStock()">Agregar</button>
    </div>
  </div>
</div>

<!-- Modal: configuración -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>Configuración</h2>
    <p class="setup-note">Datos de tu repositorio de GitHub donde vive tu watchlist.</p>
    <label>Usuario de GitHub</label>
    <input id="ownerInput" placeholder="Ej: martin123">
    <label>Nombre del repositorio</label>
    <input id="repoInput" placeholder="Ej: trailing-stop-tracker">
    <label>Token de acceso (Personal Access Token)</label>
    <input id="tokenInput" type="password" placeholder="ghp_...">
    <div class="msg" id="settingsMsg"></div>
    <div class="row-btns">
      <button class="secondary" onclick="closeSettings()">Cancelar</button>
      <button class="primary" id="saveSettingsBtn" onclick="saveSettings()">Guardar y probar</button>
    </div>
  </div>
</div>

<script>
const GITHUB_API = 'https://api.github.com';

function getConfig() {
  return {
    owner: localStorage.getItem('ts_owner') || '',
    repo: localStorage.getItem('ts_repo') || '',
    token: localStorage.getItem('ts_token') || ''
  };
}
function hasConfig() {
  const c = getConfig();
  return c.owner && c.repo && c.token;
}

function openSettings() {
  const c = getConfig();
  document.getElementById('ownerInput').value = c.owner;
  document.getElementById('repoInput').value = c.repo;
  document.getElementById('tokenInput').value = c.token;
  document.getElementById('settingsMsg').textContent = '';
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings() {
  if (!hasConfig()) return; // no dejar cerrar si aún no hay config
  document.getElementById('settingsModal').classList.remove('open');
}

async function saveSettings() {
  const owner = document.getElementById('ownerInput').value.trim();
  const repo = document.getElementById('repoInput').value.trim();
  const token = document.getElementById('tokenInput').value.trim();
  const msg = document.getElementById('settingsMsg');
  const btn = document.getElementById('saveSettingsBtn');

  if (!owner || !repo || !token) {
    msg.textContent = 'Completa los 3 campos.';
    msg.className = 'msg error';
    return;
  }

  btn.innerHTML = '<span class="spinner"></span> Probando...';
  msg.textContent = '';

  try {
    const res = await fetch(`${GITHUB_API}/repos/${owner}/${repo}/contents/watchlist.json`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) throw new Error(res.status === 404 ? 'No se encontró watchlist.json en ese repo.' : `Error ${res.status}: revisa el token o el nombre del repo.`);

    localStorage.setItem('ts_owner', owner);
    localStorage.setItem('ts_repo', repo);
    localStorage.setItem('ts_token', token);

    msg.textContent = '✓ Conectado correctamente';
    msg.className = 'msg ok';
    setTimeout(() => {
      document.getElementById('settingsModal').classList.remove('open');
      loadWatchlist();
    }, 600);
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  } finally {
    btn.textContent = 'Guardar y probar';
  }
}

async function fetchWatchlistFile() {
  const c = getConfig();
  const res = await fetch(`${GITHUB_API}/repos/${c.owner}/${c.repo}/contents/watchlist.json`, {
    headers: { 'Authorization': `Bearer ${c.token}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  if (!res.ok) throw new Error('No se pudo leer watchlist.json (' + res.status + ')');
  const json = await res.json();
  const content = JSON.parse(decodeURIComponent(escape(atob(json.content))));
  return { content, sha: json.sha };
}

async function saveWatchlistFile(content, sha, message) {
  const c = getConfig();
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
    sha
  };
  const res = await fetch(`${GITHUB_API}/repos/${c.owner}/${c.repo}/contents/watchlist.json`, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${c.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || 'No se pudo guardar en GitHub');
  }
}

async function loadWatchlist() {
  const list = document.getElementById('list');
  if (!hasConfig()) {
    list.innerHTML = `<div class="empty">Configura tu repositorio de GitHub (⚙️ arriba) para empezar.</div>`;
    openSettings();
    return;
  }
  list.innerHTML = `<div class="empty"><span class="spinner"></span> Cargando...</div>`;
  try {
    const { content } = await fetchWatchlistFile();
    const stocks = content.watchlist || [];
    if (stocks.length === 0) {
      list.innerHTML = `<div class="empty">Aún no tienes stocks en la lista.<br>Toca "+ Agregar stock" para empezar.</div>`;
      return;
    }
    list.innerHTML = stocks.map((s, i) => renderStock(s, i)).join('');
  } catch (e) {
    list.innerHTML = `<div class="empty">Error cargando datos: ${e.message}</div>`;
  }
}

function renderStock(s, index) {
  const triggered = !!s.triggered;
  const max = s.highest_price != null ? `$${Number(s.highest_price).toFixed(2)}` : 'Aún sin registrar';
  return `
    <div class="card">
      <div class="stock-row">
        <div>
          <div class="stock-symbol">${s.symbol}</div>
          <div class="stock-meta">Trailing stop: ${s.trailing_stop_pct}% · Máximo: ${max}</div>
        </div>
        <div style="text-align:right; display:flex; align-items:center; gap:10px;">
          <span class="badge ${triggered ? 'triggered' : 'active'}">${triggered ? 'Vender' : 'Activo'}</span>
          <button class="del-btn" onclick="deleteStock(${index})">🗑️</button>
        </div>
      </div>
    </div>`;
}

function openAdd() {
  document.getElementById('symbolInput').value = '';
  document.getElementById('pctInput').value = '';
  document.getElementById('addMsg').textContent = '';
  document.getElementById('addModal').classList.add('open');
}
function closeAdd() {
  document.getElementById('addModal').classList.remove('open');
}

async function addStock() {
  const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
  const pct = parseFloat(document.getElementById('pctInput').value);
  const msg = document.getElementById('addMsg');
  const btn = document.getElementById('addBtn');

  if (!symbol || !/^[A-Z0-9.\-]{1,10}$/.test(symbol)) {
    msg.textContent = 'Ingresa un símbolo válido (ej: AAPL).';
    msg.className = 'msg error';
    return;
  }
  if (!pct || pct <= 0 || pct >= 100) {
    msg.textContent = 'Ingresa un porcentaje entre 0 y 100.';
    msg.className = 'msg error';
    return;
  }

  btn.innerHTML = '<span class="spinner"></span>';
  msg.textContent = '';

  try {
    const { content, sha } = await fetchWatchlistFile();
    content.watchlist = content.watchlist || [];

    if (content.watchlist.some(s => s.symbol === symbol)) {
      throw new Error(`${symbol} ya está en tu lista.`);
    }

    content.watchlist.push({
      symbol,
      trailing_stop_pct: pct,
      highest_price: null,
      triggered: false
    });

    await saveWatchlistFile(content, sha, `Agregar ${symbol} vía app`);
    closeAdd();
    loadWatchlist();
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg error';
  } finally {
    btn.textContent = 'Agregar';
  }
}

async function deleteStock(index) {
  if (!confirm('¿Quitar este stock de tu lista?')) return;
  try {
    const { content, sha } = await fetchWatchlistFile();
    content.watchlist.splice(index, 1);
    await saveWatchlistFile(content, sha, 'Quitar stock vía app');
    loadWatchlist();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

loadWatchlist();
</script>
</body>
</html>
